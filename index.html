<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arquivo do Caso — criador de handouts</title>

  <link rel="stylesheet" href="css/app.css" />

  <!-- CSS de cada template. Pra adicionar um template novo, inclua o -->
  <!-- <link> dele aqui embaixo. -->
  <link rel="stylesheet" href="css/templates/boletim-ocorrencia.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="panel">
      <div class="brand">
        <strong>Arquivo do Caso</strong>
        criador de handouts
      </div>
      <ul class="template-list" id="template-list"></ul>
    </aside>

    <section class="panel" id="field-panel"></section>

    <main class="preview-column">
      <div class="toolbar">
        <button class="export-btn" id="export-btn">Exportar PDF</button>
      </div>
      <div id="doc-preview"></div>
    </main>
  </div>

  <!-- utilitários compartilhados, carregados antes dos templates -->
  <script src="js/utils.js"></script>

  <!-- JS de cada template. Pra adicionar um template novo, inclua o -->
  <!-- <script> dele aqui, sempre depois de utils.js e antes de app.js. -->
  <script src="js/templates/boletim-ocorrencia.js"></script>

  <!-- lógica do app, sempre por último -->
  <script src="js/app.js"></script>
</body>
</html>
